<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-label="Ba lực trên đàn piano khi trượt đều xuống dốc">
<title>Ba lực trên đàn piano khi trượt đều xuống dốc</title>
<rect width="360" height="780" fill="white" rx="10"/>
<defs>
<marker id="a2563eb" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker>
<marker id="ab91c1c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b91c1c"/></marker>
</defs>
<g font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#172033">
<g transform="translate(0 0)">
<text x="180" y="28" text-anchor="middle" font-weight="600">(a) Lực đẩy dọc mặt dốc</text>
<circle cx="180" cy="170" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<line x1="180.000000" y1="170.000000" x2="210.783074" y2="159.400538" stroke="#2563eb" stroke-width="3" marker-end="url(#a2563eb)"/>
<text x="232" y="157" fill="#2563eb" font-size="24" font-style="italic">F</text>
<line x1="180.000000" y1="170.000000" x2="149.216926" y2="80.599462" stroke="#2563eb" stroke-width="3" marker-end="url(#a2563eb)"/>
<text x="120" y="68" fill="#2563eb" font-size="24" font-style="italic">N</text>
<line x1="180.000000" y1="170.000000" x2="180.000000" y2="270.000000" stroke="#b91c1c" stroke-width="3" marker-end="url(#ab91c1c)"/>
<text x="192" y="295" fill="#b91c1c" font-size="24" font-style="italic">mg</text>
<line x1="18" y1="315" x2="342" y2="315" stroke="#cbd5e1"/>
<text x="18" y="344">Mặt dốc cao dần về bên phải</text>
<text x="18" y="372">F = mg sinθ, N = mg cosθ</text>
</g>
<g transform="translate(0 390)">
<text x="180" y="28" text-anchor="middle" font-weight="600">(b) Lực đẩy nằm ngang</text>
<circle cx="180" cy="170" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<line x1="180.000000" y1="170.000000" x2="214.432761" y2="170.000000" stroke="#2563eb" stroke-width="3" marker-end="url(#a2563eb)"/>
<text x="232" y="160" fill="#2563eb" font-size="24" font-style="italic">F</text>
<line x1="180.000000" y1="170.000000" x2="145.567239" y2="70.000000" stroke="#2563eb" stroke-width="3" marker-end="url(#a2563eb)"/>
<text x="120" y="60" fill="#2563eb" font-size="24" font-style="italic">N</text>
<line x1="180.000000" y1="170.000000" x2="180.000000" y2="270.000000" stroke="#b91c1c" stroke-width="3" marker-end="url(#ab91c1c)"/>
<text x="192" y="295" fill="#b91c1c" font-size="24" font-style="italic">mg</text>
<line x1="18" y1="315" x2="342" y2="315" stroke="#cbd5e1"/>
<text x="18" y="344">Mặt dốc cao dần về bên phải</text>
<text x="18" y="372">F = mg tanθ, N = mg/cosθ</text>
</g>
</g></svg>
