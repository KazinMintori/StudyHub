<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-label="Giản đồ lực tại giới hạn gia tốc bốn g">
<title>Giản đồ lực tại giới hạn gia tốc bốn g</title>
<rect width="360" height="780" fill="white" rx="10"/>
<defs>
<marker id="a2563eb" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker>
<marker id="ab91c1c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b91c1c"/></marker>
</defs>
<g font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#172033">
<g transform="translate(0 0)">
<text x="180" y="28" text-anchor="middle" font-weight="600">(a) Tên lửa lúc rời bệ phóng</text>
<circle cx="180" cy="220" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<line x1="180.000000" y1="220.000000" x2="180.000000" y2="60.000000" stroke="#2563eb" stroke-width="3" marker-end="url(#a2563eb)"/>
<text x="144" y="75" fill="#2563eb" font-size="24" font-style="italic">F</text>
<line x1="180.000000" y1="220.000000" x2="180.000000" y2="252.000000" stroke="#b91c1c" stroke-width="3" marker-end="url(#ab91c1c)"/>
<text x="192" y="279" fill="#b91c1c" font-size="24" font-style="italic">Mg</text>
<line x1="18" y1="315" x2="342" y2="315" stroke="#cbd5e1"/>
<text x="18" y="344">F = 5Mg hướng lên</text>
<text x="18" y="372">F − Mg = 4Mg</text>
</g>
<g transform="translate(0 390)">
<text x="180" y="28" text-anchor="middle" font-weight="600">(b) Phi hành gia trong tên lửa</text>
<circle cx="180" cy="220" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<line x1="180.000000" y1="220.000000" x2="180.000000" y2="60.000000" stroke="#2563eb" stroke-width="3" marker-end="url(#a2563eb)"/>
<text x="144" y="75" fill="#2563eb" font-size="24" font-style="italic">N</text>
<line x1="180.000000" y1="220.000000" x2="180.000000" y2="252.000000" stroke="#b91c1c" stroke-width="3" marker-end="url(#ab91c1c)"/>
<text x="192" y="279" fill="#b91c1c" font-size="24" font-style="italic">w</text>
<line x1="18" y1="315" x2="342" y2="315" stroke="#cbd5e1"/>
<text x="18" y="344">N = 5w hướng lên</text>
<text x="18" y="372">N − w = 4w</text>
</g>
</g></svg>
