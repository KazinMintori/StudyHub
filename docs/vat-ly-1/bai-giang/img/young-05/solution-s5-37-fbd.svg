<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-label="Giản đồ lực hai kiện trượt đều, minh họa tỉ lệ lực">
<title>Giản đồ lực hai kiện trượt đều, minh họa tỉ lệ lực</title>
<rect width="360" height="780" fill="white" rx="10"/>
<defs>
<marker id="a2563eb" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker>
