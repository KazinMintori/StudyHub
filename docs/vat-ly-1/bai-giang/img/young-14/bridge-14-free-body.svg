<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560" role="img" aria-labelledby="title desc">
<title id="title">Lực và mômen của hệ trụ lăn gắn lò xo</title>
<desc id="desc">Chiều dương tọa độ sang trái, xét hệ ở x dương. Sơ đồ tịnh tiến có phản lực N lên, trọng lực Mg xuống, lực lò xo sang phải và ma sát sang trái. Sơ đồ quay giữ ma sát tại tiếp điểm dưới tâm với cánh tay đòn R.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#245caf"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#b44343"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#347651"/></marker>
</defs>
<rect width="460" height="560" fill="white"/>
<g font-family="Arial, sans-serif" font-size="26" fill="#26364b">
<text x="20" y="26" font-weight="700">(a) Tổng lực</text>
<line x1="220" y1="120" x2="220" y2="42" stroke="#245caf" stroke-width="2.8" marker-end="url(#blue)"/>
<line x1="220" y1="120" x2="220" y2="198" stroke="#b44343" stroke-width="2.8" marker-end="url(#red)"/>
<line x1="220" y1="120" x2="380" y2="120" stroke="#245caf" stroke-width="2.8" marker-end="url(#blue)"/>
<line x1="220" y1="120" x2="166.67" y2="120" stroke="#347651" stroke-width="2.8" marker-end="url(#green)"/>
<circle cx="220" cy="120" r="6" fill="#4b5d75"/>
<text x="235" y="64">N</text><text x="235" y="184">Mg</text>
<text x="306" y="108">−kx</text><text x="176" y="108">f</text>
<text x="20" y="280" font-weight="700">(b) Mômen ma sát</text>
<circle cx="230" cy="380" r="60" fill="#edf2f7" stroke="#65778d" stroke-width="2"/>
<circle cx="230" cy="380" r="4" fill="#4b5d75"/>
<line x1="102" y1="440" x2="368" y2="440" stroke="#8390a0" stroke-width="1.8"/>
<line x1="230" y1="380" x2="230" y2="440" stroke="#245caf" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="230" y1="440" x2="176.67" y2="440" stroke="#347651" stroke-width="2.8" marker-end="url(#green)"/>
<circle cx="230" cy="440" r="4" fill="#347651"/>
<text x="246" y="414">R</text><text x="184" y="426">f</text>
<line x1="365" y1="540" x2="285" y2="540" stroke="#245caf" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="33" y="546">x</text>
</g></svg>
