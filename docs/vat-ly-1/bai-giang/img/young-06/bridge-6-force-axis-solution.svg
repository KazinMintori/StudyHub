<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ lực và trục tọa độ của vật gắn lò xo phi tuyến</title>
  <desc id="desc">Tại vị trí x1, vật chịu lực lò xo ax1 bình phương hướng lên và trọng lực mg hướng xuống. Trục x có chiều dương hướng xuống với các mốc không, x1 và x2. Độ dài các mũi tên lực chỉ có tính sơ đồ.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#39313f"/></marker>
    <marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#705286"/></marker>
  </defs>
  <rect width="480" height="400" fill="#fffdfa"/>
  <g font-family="'Be Vietnam Pro',Arial,sans-serif" font-size="24" fill="#39313f">
    <rect x="120" y="166" width="64" height="58" rx="3" fill="#ead8ad" stroke="#8e7042" stroke-width="2"/>
    <text x="141" y="203">m</text>
    <path d="M152 163V65" stroke="#705286" stroke-width="4" marker-end="url(#purple)"/>
    <path d="M152 227V320" stroke="#705286" stroke-width="4" marker-end="url(#purple)"/>
    <text x="176" y="88">ax₁²</text><text x="177" y="310">mg</text>
    <path d="M330 55V355" stroke="#39313f" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M320 80H340M320 195H340M320 330H340" stroke="#39313f" stroke-width="2"/>
    <path d="M188 195H316" stroke="#8b838d" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="350" y="88">0</text><text x="350" y="203">x₁</text><text x="350" y="338">x₂</text>
    <text x="322" y="384">x</text>
    <text x="30" y="370" font-size="20">Mũi tên lực không theo tỉ lệ</text>
  </g>
</svg>
