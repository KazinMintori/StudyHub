<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
  <title id="title">Hai đoạn thẳng công suất có giá trị cực đại gấp đôi trung bình</title>
  <desc id="desc">Đồ thị tăng từ công suất không tại t1 lên P cực đại tại thời điểm giữa tm, rồi giảm về không tại t2. Đường ngang đứt nét là công suất trung bình bằng nửa cực đại.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#39313f"/></marker></defs>
  <rect width="480" height="340" fill="#fffdfa"/>
  <g font-family="'Be Vietnam Pro',Arial,sans-serif" font-size="23" fill="#39313f">
    <path d="M90 270L260 70L430 270Z" fill="#e5daed"/>
    <path d="M72 270H459" stroke="#39313f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M72 285V28" stroke="#39313f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M90 270L260 70L430 270" stroke="#705286" stroke-width="4" fill="none"/>
    <path d="M72 170H430" stroke="#8e7042" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M72 70H260M260 70V270" stroke="#8b838d" stroke-width="1.4" stroke-dasharray="5 5"/>
    <text x="47" y="25">P</text><text x="455" y="307">t</text>
    <text x="7" y="78">P<tspan baseline-shift="sub" font-size="18">max</tspan></text>
    <text x="27" y="176">P̄</text><text x="40" y="276">0</text>
    <text x="80" y="309">t₁</text><text x="245" y="309">tₘ</text><text x="418" y="309">t₂</text>
    <text x="290" y="35">P̄ = P<tspan baseline-shift="sub" font-size="18">max</tspan><tspan baseline-shift="baseline">/2</tspan></text>
  </g>
</svg>
