<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%" style="background:#f5f4f9; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5a37a8"/>
    </marker>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f4f9"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1c2b">Đồ thị Hình 5.4 MMDS (Bài tập 4)</text>
  <text x="340" y="54" text-anchor="middle" font-size="14" fill="#5a37a8">A → B, C, D | B → A, D | C → E | D → B, C | E không có liên kết ra (nút cụt)</text>

  <!-- Positions:
       A: (160, 140) | B: (380, 140)
       C: (160, 300) | D: (380, 300)
       E: (560, 300)
  -->

  <!-- A -> B & B -> A -->
  <path d="M 195 130 C 255 110, 300 110, 345 130" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M 345 150 C 300 170, 255 170, 195 150" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- A -> C -->
  <path d="M 160 175 L 160 265" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- A -> D -->
  <path d="M 185 160 L 355 280" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- B -> D & D -> B -->
  <path d="M 390 175 C 405 210, 405 235, 390 265" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M 370 265 C 355 235, 355 210, 370 175" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- D -> C -->
  <path d="M 345 300 L 195 300" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- C -> E -->
  <path d="M 195 315 C 300 375, 430 375, 525 315" fill="none" stroke="#5a37a8" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Nodes -->
  <!-- Node A -->
  <g transform="translate(160, 140)" filter="url(#shadow)">
    <circle r="32" fill="#5a37a8" stroke="#5a37a8" stroke-width="2.5"/>
    <text y="5" text-anchor="middle" font-size="18" font-weight="800" fill="#5a37a8">A</text>
    <rect x="-35" y="38" width="70" height="20" rx="4" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1"/>
    <text y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#5a37a8">Bậc ra: 3</text>
  </g>

  <!-- Node B -->
  <g transform="translate(380, 140)" filter="url(#shadow)">
    <circle r="32" fill="#5a37a8" stroke="#5a37a8" stroke-width="2.5"/>
    <text y="5" text-anchor="middle" font-size="18" font-weight="800" fill="#1f1c2b">B</text>
    <rect x="-35" y="38" width="70" height="20" rx="4" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1"/>
    <text y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#6b6580">Bậc ra: 2</text>
  </g>

  <!-- Node C -->
  <g transform="translate(160, 300)" filter="url(#shadow)">
    <circle r="32" fill="#5a37a8" stroke="#5a37a8" stroke-width="2.5"/>
    <text y="5" text-anchor="middle" font-size="18" font-weight="800" fill="#1f1c2b">C</text>
    <rect x="-35" y="38" width="70" height="20" rx="4" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1"/>
    <text y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#6b6580">Bậc ra: 1</text>
  </g>

  <!-- Node D -->
  <g transform="translate(380, 300)" filter="url(#shadow)">
    <circle r="32" fill="#5a37a8" stroke="#5a37a8" stroke-width="2.5"/>
    <text y="5" text-anchor="middle" font-size="18" font-weight="800" fill="#1f1c2b">D</text>
    <rect x="-35" y="38" width="70" height="20" rx="4" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1"/>
    <text y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#6b6580">Bậc ra: 2</text>
  </g>

  <!-- Node E (Dead End) -->
  <g transform="translate(560, 300)" filter="url(#shadow)">
    <circle r="32" fill="#f5f4f9" stroke="#5a37a8" stroke-width="2.5"/>
    <text y="5" text-anchor="middle" font-size="18" font-weight="800" fill="#5a37a8">E</text>
    <rect x="-42" y="38" width="84" height="20" rx="4" fill="#eee9fb" stroke="#5a37a8" stroke-width="1"/>
    <text y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#5a37a8">Bậc ra: 0 (CỤT)</text>
  </g>
</svg>