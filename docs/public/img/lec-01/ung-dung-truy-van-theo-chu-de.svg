<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Truy vấn theo chủ đề (Topic-Sensitive PageRank): Ngữ nghĩa từ &quot;Jaguar&quot;</text>
    
    <!-- Central Query -->
    <rect x="40" y="80" width="180" height="80" rx="8" fill="#5a37a8" filter="url(#shadow)"/>
    <text x="130" y="115" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Truy vấn: &quot;Jaguar&quot;</text>
    <text x="130" y="140" font-size="14" fill="#eee9fb" text-anchor="middle">(Từ khóa đa nghĩa)</text>

    <!-- 4 Topics -->
    <path d="M 225 95 L 340 60" stroke="#5a37a8" stroke-width="1.5" marker-end="url(#grayArrow)"/>
    <rect x="350" y="45" width="170" height="32" rx="4" fill="#f5f4f9" stroke="#eee9fb"/>
    <text x="435" y="66" font-size="14" fill="#6b6580" text-anchor="middle">1. Loài báo (Động vật)</text>

    <path d="M 225 110 L 340 100" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="350" y="85" width="170" height="34" rx="4" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="435" y="106" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">2. Hãng ô tô (Xe cộ) ★</text>

    <path d="M 225 130 L 340 140" stroke="#5a37a8" stroke-width="1.5" marker-end="url(#grayArrow)"/>
    <rect x="350" y="125" width="170" height="32" rx="4" fill="#f5f4f9" stroke="#eee9fb"/>
    <text x="435" y="146" font-size="14" fill="#6b6580" text-anchor="middle">3. Apple OS X Jaguar</text>

    <path d="M 225 145 L 340 180" stroke="#5a37a8" stroke-width="1.5" marker-end="url(#grayArrow)"/>
    <rect x="350" y="165" width="170" height="32" rx="4" fill="#f5f4f9" stroke="#eee9fb"/>
    <text x="435" y="186" font-size="14" fill="#6b6580" text-anchor="middle">4. Máy game Atari Jaguar</text>

    <!-- Context Result -->
    <rect x="545" y="70" width="180" height="100" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="635" y="98" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Chủ đề xác định: Xe</text>
    <text x="635" y="125" font-size="14" fill="#4f4a62" text-anchor="middle">Ưu tiên các trang bán xe,</text>
    <text x="635" y="145" font-size="14" fill="#4f4a62" text-anchor="middle">thay vì trang sở thú</text>
  
</svg>