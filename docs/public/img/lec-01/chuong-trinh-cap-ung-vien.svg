<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Quy trình tìm cặp tương đồng: Shingling → MinHash → LSH → Hậu kiểm Jaccard</text>
    
    <g transform="translate(30, 60)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="155" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
      <text x="77" y="28" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">1. Shingling</text>
      <text x="77" y="50" font-size="14" fill="#4f4a62" text-anchor="middle">Tài liệu văn bản</text>
      <text x="77" y="70" font-size="14" fill="#5a37a8" text-anchor="middle">↓</text>
      <text x="77" y="95" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Tập Shingle k ký tự</text>
      <text x="77" y="120" font-size="14" fill="#5a37a8" text-anchor="middle">(Tập hợp không lặp)</text>

      <!-- Arrow 1 -->
      <path d="M 160 72 L 180 72" stroke="#5a37a8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2 -->
      <rect x="185" y="0" width="155" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
      <text x="262" y="28" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">2. MinHash</text>
      <text x="262" y="50" font-size="14" fill="#4f4a62" text-anchor="middle">Hoán vị ngẫu nhiên</text>
      <text x="262" y="70" font-size="14" fill="#5a37a8" text-anchor="middle">↓</text>
      <text x="262" y="95" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Chữ ký ngắn gọn</text>
      <text x="262" y="120" font-size="14" fill="#5a37a8" text-anchor="middle">Pr(h(A)=h(B)) = J(A,B)</text>

      <!-- Arrow 2 -->
      <path d="M 345 72 L 365 72" stroke="#5a37a8" stroke-width="2" marker-end="url(#greenArrow)"/>

      <!-- Step 3 -->
      <rect x="370" y="0" width="155" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
      <text x="447" y="28" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">3. LSH Băm dải</text>
      <text x="447" y="50" font-size="14" fill="#4f4a62" text-anchor="middle">Chia b dải, r hàng</text>
      <text x="447" y="70" font-size="14" fill="#5a37a8" text-anchor="middle">↓</text>
      <text x="447" y="95" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Tập cặp ứng viên A</text>
      <text x="447" y="120" font-size="14" fill="#5a37a8" text-anchor="middle">Tránh xét C(N, 2)</text>

      <!-- Arrow 3 -->
      <path d="M 530 72 L 550 72" stroke="#5a37a8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 4 -->
      <rect x="555" y="0" width="145" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="627" y="28" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">4. Hậu kiểm</text>
      <text x="627" y="50" font-size="14" fill="#4f4a62" text-anchor="middle">Chỉ tính Jaccard</text>
      <text x="627" y="70" font-size="14" fill="#5a37a8" text-anchor="middle">trên cặp trong A</text>
      <text x="627" y="95" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Kiểm tra: J ≥ τ</text>
      <text x="627" y="120" font-size="14" fill="#5a37a8" text-anchor="middle">Xuất kết quả R̂</text>
    </g>
  
</svg>