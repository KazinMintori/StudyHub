<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">So sánh trực tiếp mọi cặp tài liệu: Bùng nổ tổ hợp N(N-1)/2</text>
    
    <!-- Doc 1 -->
    <rect x="50" y="60" width="160" height="145" rx="6" fill="#ffffff" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="130" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tài liệu C₁</text>
    <rect x="65" y="100" width="130" height="12" rx="3" fill="#eee9fb"/>
    <rect x="65" y="120" width="130" height="12" rx="3" fill="#eee9fb"/>
    <rect x="65" y="140" width="80" height="12" rx="3" fill="#eee9fb"/>
    <rect x="65" y="160" width="130" height="12" rx="3" fill="#eee9fb"/>
    <text x="130" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Bản gốc</text>

    <!-- Doc 2 -->
    <rect x="250" y="60" width="160" height="145" rx="6" fill="#ffffff" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="330" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tài liệu C₂</text>
    <rect x="265" y="100" width="130" height="12" rx="3" fill="#eee9fb"/>
    <rect x="265" y="120" width="130" height="12" rx="3" fill="#eee9fb"/>
    <rect x="265" y="140" width="80" height="12" rx="3" fill="#eee9fb"/>
    <rect x="265" y="160" width="110" height="12" rx="3" fill="#eee9fb"/>
    <text x="330" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Sửa vài đoạn (gần trùng)</text>

    <!-- Calculation box -->
    <rect x="450" y="60" width="270" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="585" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Xét mọi cặp trong kho:</text>
    <text x="585" y="120" font-size="15" font-weight="700" fill="#5a37a8" text-anchor="middle">C(N, 2) = N(N − 1) / 2</text>
    <text x="585" y="150" font-size="14" fill="#1f1c2b" text-anchor="middle">Với N = 10⁶ tài liệu:</text>
    <text x="585" y="172" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">≈ 500 TỶ CẶP SO SÁNH!</text>
    <text x="585" y="194" font-size="14" fill="#5a37a8" text-anchor="middle">Cần Shingling + MinHash + LSH</text>
  
</svg>