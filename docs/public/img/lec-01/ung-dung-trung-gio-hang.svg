<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Bài tập 1.2.2: Trùng tập 10 mặt hàng giỏ hàng giữa 2 người khác nhau</text>
    
    <!-- Cart matching -->
    <rect x="40" y="60" width="310" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="195" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Không gian giỏ hàng</text>
    <text x="60" y="110" font-size="14" fill="#4f4a62">• Mua 10 trong 1000 mặt hàng</text>
    <text x="60" y="130" font-size="14" fill="#4f4a62">• Số tập 10 món: C(1000, 10) ≈ 2.63 × 10²³</text>
    <rect x="55" y="145" width="280" height="32" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="195" y="165" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Xác suất trùng 2 giỏ = 1 / C(1000, 10) ≈ 3.8 × 10⁻²⁴</text>
    <text x="195" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">100 triệu người · Mỗi người đi 100 lần/năm</text>

    <!-- Arrow -->
    <path d="M 355 135 L 405 135" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#greenArrow)"/>

    <!-- Cart Expectation -->
    <rect x="415" y="60" width="305" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="567" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Kỳ vọng số cặp lượt trùng ngẫu nhiên:</text>
    <rect x="430" y="105" width="275" height="40" rx="6" fill="#ffffff" stroke="#eee9fb"/>
    <text x="567" y="130" font-size="15" font-weight="700" fill="#5a37a8" text-anchor="middle">E[Y] ≈ 1.90 × 10⁻⁴ (Rất nhỏ!)</text>
    <text x="567" y="165" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Pr(Y ≥ 1) ≤ E[Y] ≈ 0.019%</text>
    <text x="567" y="190" font-size="14" fill="#4f4a62" text-anchor="middle">Không bị ngập bởi trùng ngẫu nhiên như khách sạn</text>
  
</svg>