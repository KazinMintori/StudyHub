<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Xử lý dòng dữ liệu: Phân biệt Mẫu đại diện và Bộ lọc thành viên</text>
    
    <!-- Sampling Box -->
    <rect x="50" y="60" width="300" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="200" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Lấy mẫu (Sampling)</text>
    <text x="70" y="115" font-size="14" fill="#4f4a62">• Giữ lại một phần đại diện của dòng</text>
    <text x="70" y="135" font-size="14" fill="#4f4a62">• Lấy mẫu theo khóa (User): đo mức lặp</text>
    <text x="70" y="155" font-size="14" fill="#4f4a62">• Lấy mẫu hồ chứa (Reservoir): mẫu ngẫu nhiên</text>
    <text x="200" y="195" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Mục tiêu: Thống kê không chệch</text>

    <!-- Bloom Filter Box -->
    <rect x="410" y="60" width="300" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="560" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Bộ lọc Bloom (Membership Filter)</text>
    <text x="430" y="115" font-size="14" fill="#4f4a62">• Kiểm tra phần tử x có thuộc tập S không</text>
    <text x="430" y="135" font-size="14" fill="#4f4a62">• Trả lời: &quot;Chắc chắn KHÔNG&quot; (Không bỏ sót)</text>
    <text x="430" y="155" font-size="14" fill="#4f4a62">• Trả lời: &quot;CÓ THỂ CÓ&quot; (Có sai số dương tính)</text>
    <text x="560" y="195" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Mục tiêu: Tiết kiệm tối đa bộ nhớ tra cứu</text>
  
</svg>