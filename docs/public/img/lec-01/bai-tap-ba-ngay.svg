<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Bài tập 1.2.1(c): Nâng tiêu chuẩn lên TRÙNG TRONG CẢ 3 NGÀY (k = 3)</text>
    
    <!-- 3 days inspection -->
    <rect x="50" y="60" width="310" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="205" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Phép thử trên bộ 3 ngày:</text>
    <text x="70" y="110" font-size="14" fill="#4f4a62">• Số bộ 3 ngày: C(1000, 3) ≈ 1.66 × 10⁸</text>
    <text x="70" y="130" font-size="14" fill="#4f4a62">• Xác suất trùng 3 ngày độc lập:</text>
    <rect x="70" y="142" width="270" height="30" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="205" y="162" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">p³ = (10⁻⁹)³ = 10⁻²⁷</text>
    <text x="205" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Số mũ k=3 dập tắt xác suất cực mạnh</text>

    <!-- Arrow -->
    <path d="M 365 135 L 415 135" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#greenArrow)"/>

    <!-- Result -->
    <rect x="425" y="60" width="285" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="567" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Kỳ vọng số cặp trùng ngẫu nhiên:</text>
    <rect x="440" y="105" width="255" height="40" rx="6" fill="#ffffff" stroke="#eee9fb"/>
    <text x="567" y="130" font-size="16" font-weight="700" fill="#5a37a8" text-anchor="middle">E[X_c] ≈ 0.0831</text>
    <text x="567" y="165" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Kỳ vọng ngẫu nhiên GIẢM XUỐNG DƯỚI 1!</text>
    <text x="567" y="190" font-size="14" fill="#4f4a62" text-anchor="middle">Dấu hiệu nếu xuất hiện ít bị chìm trong nhiễu</text>
  
</svg>