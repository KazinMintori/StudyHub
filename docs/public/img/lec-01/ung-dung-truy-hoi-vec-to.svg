<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Truy hồi vector: Tìm k đoạn văn bản gần nhất với truy vấn q</text>
    
    <!-- Query Vector -->
    <rect x="40" y="65" width="170" height="135" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="125" y="92" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Truy vấn q</text>
    <text x="125" y="115" font-size="14" fill="#4f4a62" text-anchor="middle">Mã hóa thành vector:</text>
    <rect x="55" y="130" width="140" height="30" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="125" y="150" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">[0.14, -0.82, ..., 0.45]</text>
    <text x="125" y="185" font-size="14" fill="#5a37a8" text-anchor="middle">D = 3072 chiều</text>

    <!-- Search process -->
    <path d="M 215 130 L 330 130" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="272" y="120" font-size="14" fill="#5a37a8" font-weight="600" text-anchor="middle">Kho 10 tỷ vector</text>

    <!-- Vector Space -->
    <rect x="340" y="60" width="220" height="150" rx="8" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1.5"/>
    <text x="450" y="82" font-size="14" font-weight="700" fill="#6b6580" text-anchor="middle">Không gian vector embedding</text>
    <!-- Query dot -->
    <circle cx="450" cy="140" r="7" fill="#5a37a8"/>
    <text x="450" y="130" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">q</text>
    <circle cx="450" cy="140" r="45" fill="none" stroke="#5a37a8" stroke-dasharray="4,4"/>
    <!-- Near neighbors -->
    <circle cx="430" cy="135" r="5" fill="#5a37a8"/>
    <circle cx="465" cy="125" r="5" fill="#5a37a8"/>
    <circle cx="445" cy="165" r="5" fill="#5a37a8"/>
    <!-- Far vectors -->
    <circle cx="370" cy="100" r="4" fill="#5a37a8"/>
    <circle cx="520" cy="170" r="4" fill="#5a37a8"/>
    <circle cx="510" cy="95" r="4" fill="#5a37a8"/>
    <text x="450" y="200" font-size="14" fill="#5a37a8" font-weight="600" text-anchor="middle">k láng giềng gần nhất</text>

    <!-- Top-k results -->
    <rect x="580" y="65" width="140" height="135" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="650" y="92" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Đầu ra top-k</text>
    <rect x="595" y="105" width="110" height="20" rx="3" fill="#ffffff"/>
    <text x="650" y="120" font-size="14" fill="#5a37a8" text-anchor="middle">1. Đoạn doc 42</text>
    <rect x="595" y="132" width="110" height="20" rx="3" fill="#ffffff"/>
    <text x="650" y="147" font-size="14" fill="#5a37a8" text-anchor="middle">2. Đoạn doc 108</text>
    <rect x="595" y="159" width="110" height="20" rx="3" fill="#ffffff"/>
    <text x="650" y="174" font-size="14" fill="#5a37a8" text-anchor="middle">3. Đoạn doc 99</text>
  
</svg>