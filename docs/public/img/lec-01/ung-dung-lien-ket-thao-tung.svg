<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Mô hình liên kết thao túng (Spam Farm - Hình 5.16 MMDS)</text>
    
    <!-- Inaccessible web -->
    <rect x="40" y="60" width="170" height="150" rx="8" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1.5"/>
    <text x="125" y="85" font-size="14" font-weight="700" fill="#6b6580" text-anchor="middle">Web ngoài tầm</text>
    <text x="125" y="110" font-size="14" fill="#5a37a8" text-anchor="middle">(Không tác động được)</text>
    <circle cx="125" cy="150" r="22" fill="#f5f4f9"/>
    <text x="125" y="155" font-size="14" fill="#6b6580" text-anchor="middle">Tin cậy</text>

    <!-- Accessible web -->
    <rect x="235" y="60" width="170" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="320" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Trang đặt link</text>
    <text x="320" y="110" font-size="14" fill="#5a37a8" text-anchor="middle">(Blog, comment, forum)</text>
    <circle cx="320" cy="150" r="22" fill="#ffffff" stroke="#5a37a8"/>
    <text x="320" y="155" font-size="14" fill="#5a37a8" text-anchor="middle">Link out</text>

    <!-- Spam Farm Cluster -->
    <rect x="430" y="60" width="290" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="575" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Cụm kiểm soát (Spam Farm)</text>
    
    <circle cx="485" cy="140" r="26" fill="#5a37a8" filter="url(#shadow)"/>
    <text x="485" y="146" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Đích t</text>

    <circle cx="640" cy="110" r="18" fill="#ffffff" stroke="#5a37a8"/>
    <text x="640" y="115" font-size="14" fill="#5a37a8" text-anchor="middle">s₁</text>
    <circle cx="640" cy="150" r="18" fill="#ffffff" stroke="#5a37a8"/>
    <text x="640" y="155" font-size="14" fill="#5a37a8" text-anchor="middle">s₂</text>
    <circle cx="640" cy="185" r="18" fill="#ffffff" stroke="#5a37a8"/>
    <text x="640" y="190" font-size="14" fill="#5a37a8" text-anchor="middle">sm</text>

    <!-- Links -->
    <path d="M 345 150 L 455 142" stroke="#5a37a8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 515 130 L 618 112" stroke="#5a37a8" stroke-width="1.5" marker-end="url(#redArrow)"/>
    <path d="M 618 118 L 515 136" stroke="#5a37a8" stroke-width="1.5" marker-end="url(#redArrow)"/>
    <path d="M 515 142 L 618 150" stroke="#5a37a8" stroke-width="1.5" marker-end="url(#redArrow)"/>
    <path d="M 618 154 L 515 146" stroke="#5a37a8" stroke-width="1.5" marker-end="url(#redArrow)"/>

    <text x="575" y="200" font-size="14" fill="#5a37a8" text-anchor="middle">Hàng nghìn trang hỗ trợ trỏ 2 chiều với đích t</text>
  
</svg>