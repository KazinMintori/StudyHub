<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Bài toán hồ sơ lưu trú: Cặp người (u, v) trùng khách sạn trong 2 ngày khác nhau</text>
    
    <!-- Day s -->
    <rect x="60" y="60" width="280" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="200" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Ngày quan sát s</text>
    <rect x="80" y="105" width="240" height="30" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="200" y="125" font-size="14" font-weight="600" fill="#1f1c2b" text-anchor="middle">Người u ở Khách sạn H₁</text>
    <rect x="80" y="145" width="240" height="30" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="200" y="165" font-size="14" font-weight="600" fill="#1f1c2b" text-anchor="middle">Người v ở Khách sạn H₁ (TRÙNG)</text>
    <text x="200" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Cùng ở khách sạn H₁ trong ngày s</text>

    <!-- AND connector -->
    <circle cx="380" cy="132" r="20" fill="#1f1c2b"/>
    <text x="380" y="137" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">VÀ</text>

    <!-- Day t -->
    <rect x="420" y="60" width="280" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="560" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Ngày quan sát t (t ≠ s)</text>
    <rect x="440" y="105" width="240" height="30" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="560" y="125" font-size="14" font-weight="600" fill="#1f1c2b" text-anchor="middle">Người u ở Khách sạn H₂</text>
    <rect x="440" y="145" width="240" height="30" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="560" y="165" font-size="14" font-weight="600" fill="#1f1c2b" text-anchor="middle">Người v ở Khách sạn H₂ (TRÙNG)</text>
    <text x="560" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Khách sạn H₂ có thể KHÁC khách sạn H₁!</text>
  
</svg>