<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="30" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Quá tải bộ nhớ: Tệp nhật ký D trên đĩa và Bộ nhớ chính M khả dụng</text>
    
    <!-- Disk File -->
    <rect x="40" y="55" width="230" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="155" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Ổ đĩa (Tệp nhật ký D)</text>
    <rect x="55" y="95" width="200" height="24" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="65" y="111" font-size="14" fill="#4f4a62">a.vn, 40 byte, 2026-03-01</text>
    <rect x="55" y="125" width="200" height="24" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="65" y="141" font-size="14" fill="#4f4a62">b.vn, 25 byte, 2026-03-01</text>
    <rect x="55" y="155" width="200" height="24" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="65" y="171" font-size="14" fill="#4f4a62">a.vn, 15 byte, 2026-03-02</text>
    <text x="155" y="196" font-size="14" fill="#5a37a8" text-anchor="middle">Dung lượng D vượt quá RAM (D &gt; M)</text>

    <!-- Scanning Arrow -->
    <path d="M 285 130 L 460 130" stroke="#5a37a8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <text x="372" y="120" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Đọc tuần tự từng dòng</text>

    <!-- RAM Table -->
    <rect x="475" y="55" width="245" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="597" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Bộ nhớ chính RAM (Ngân sách M)</text>
    <rect x="495" y="95" width="205" height="24" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="505" y="111" font-size="14" font-weight="600" fill="#1f1c2b">a.vn → 40 + 15 = 55 byte</text>
    <rect x="495" y="125" width="205" height="24" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="505" y="141" font-size="14" font-weight="600" fill="#1f1c2b">b.vn → 25 byte</text>
    <rect x="495" y="155" width="205" height="24" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="505" y="171" font-size="14" font-weight="600" fill="#1f1c2b">c.vn → 0 byte</text>
    <text x="597" y="196" font-size="14" fill="#5a37a8" text-anchor="middle">Chỉ giữ bảng tổng theo máy chủ phân biệt</text>
  
</svg>