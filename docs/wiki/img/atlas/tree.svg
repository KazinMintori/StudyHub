<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Cây khung nối đủ bốn đỉnh bằng các cạnh AB, BC và AD</title><desc id="desc">Cây khung nối đủ bốn đỉnh bằng các cạnh AB, BC và AD. Các nhãn và ví dụ được giải thích trong bài.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="600" height="400" fill="#fff" rx="16"/>
<g font-family="'Be Vietnam Pro','Segoe UI',sans-serif"><line x1="100" y1="190" x2="300" y2="75" stroke="#2f5fd0" stroke-width="4"/><line x1="300" y1="75" x2="500" y2="190" stroke="#2f5fd0" stroke-width="4"/><line x1="100" y1="190" x2="300" y2="315" stroke="#2f5fd0" stroke-width="4"/><circle cx="100" cy="190" r="31" fill="#eee9fb" stroke="#6540ad" stroke-width="3"/><text x="100" y="200" text-anchor="middle" font-size="28" fill="#27233a">A</text><circle cx="300" cy="75" r="31" fill="#eee9fb" stroke="#6540ad" stroke-width="3"/><text x="300" y="85" text-anchor="middle" font-size="28" fill="#27233a">B</text><circle cx="500" cy="190" r="31" fill="#eee9fb" stroke="#6540ad" stroke-width="3"/><text x="500" y="200" text-anchor="middle" font-size="28" fill="#27233a">C</text><circle cx="300" cy="315" r="31" fill="#eee9fb" stroke="#6540ad" stroke-width="3"/><text x="300" y="325" text-anchor="middle" font-size="28" fill="#27233a">D</text><text x="300" y="385" text-anchor="middle" font-size="26" fill="#27233a">4 đỉnh · 3 cạnh · Không chu trình</text></g></svg>