<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Cộng hai vector bằng quy tắc hình bình hành</title><desc id="desc">Cộng hai vector bằng quy tắc hình bình hành. Các nhãn và ví dụ được giải thích trong bài.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="600" height="400" fill="#fff" rx="16"/>
<g font-family="'Be Vietnam Pro','Segoe UI',sans-serif"><line x1="45" y1="330" x2="540" y2="330" stroke="#625b76" stroke-width="3"/><line x1="80" y1="365" x2="80" y2="35" stroke="#625b76" stroke-width="3"/><line x1="80" y1="330" x2="350" y2="265" stroke="#2f5fd0" stroke-width="4" marker-end="url(#arrow)"/><line x1="80" y1="330" x2="170" y2="135" stroke="#176b46" stroke-width="4" marker-end="url(#arrow)"/><line x1="80" y1="330" x2="440" y2="70" stroke="#6540ad" stroke-width="5" marker-end="url(#arrow)"/><line x1="350" y1="265" x2="440" y2="70" stroke="#176b46" stroke-width="3" stroke-dasharray="8 6"/><line x1="170" y1="135" x2="440" y2="70" stroke="#2f5fd0" stroke-width="3" stroke-dasharray="8 6"/><text x="400" y="310" text-anchor="middle" font-size="28" fill="#2f5fd0">u = (3, 1)</text><text x="130" y="100" text-anchor="middle" font-size="28" fill="#176b46">v = (1, 3)</text><text x="415" y="40" text-anchor="middle" font-size="26" fill="#6540ad">u + v = (4, 4)</text></g></svg>