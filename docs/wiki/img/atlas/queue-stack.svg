<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Cùng thêm A rồi B rồi C, hàng đợi lấy A còn ngăn xếp lấy C</title><desc id="desc">Cùng thêm A rồi B rồi C, hàng đợi lấy A còn ngăn xếp lấy C. Các nhãn và ví dụ được giải thích trong bài.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="600" height="400" fill="#fff" rx="16"/>
<g font-family="'Be Vietnam Pro','Segoe UI',sans-serif"><text x="150" y="45" text-anchor="middle" font-size="28" fill="#27233a">Hàng đợi</text><text x="450" y="45" text-anchor="middle" font-size="28" fill="#27233a">Ngăn xếp</text><rect x="50" y="130" width="60" height="80" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="80" y="180" text-anchor="middle" font-size="28" fill="#27233a">A</text><rect x="400" y="250" width="100" height="65" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="450" y="294" text-anchor="middle" font-size="28" fill="#27233a">A</text><rect x="118" y="130" width="60" height="80" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="148" y="180" text-anchor="middle" font-size="28" fill="#27233a">B</text><rect x="400" y="175" width="100" height="65" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="450" y="219" text-anchor="middle" font-size="28" fill="#27233a">B</text><rect x="186" y="130" width="60" height="80" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="216" y="180" text-anchor="middle" font-size="28" fill="#27233a">C</text><rect x="400" y="100" width="100" height="65" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="450" y="144" text-anchor="middle" font-size="28" fill="#27233a">C</text><line x1="70" y1="245" x2="70" y2="325" stroke="#2f5fd0" stroke-width="4" marker-end="url(#arrow)"/><text x="120" y="365" text-anchor="middle" font-size="26" fill="#2f5fd0">A ra trước</text><line x1="520" y1="140" x2="565" y2="85" stroke="#176b46" stroke-width="4" marker-end="url(#arrow)"/><text x="450" y="365" text-anchor="middle" font-size="26" fill="#176b46">C ra trước</text></g></svg>