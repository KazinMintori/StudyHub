<title id="title">Entropy nhị phân bằng 0 khi chắc chắn và đạt 1 bit khi cân bằng</title><desc id="desc">Entropy nhị phân bằng 0 khi chắc chắn và đạt 1 bit khi cân bằng. Các nhãn và ví dụ được giải thích trong bài.</desc>
