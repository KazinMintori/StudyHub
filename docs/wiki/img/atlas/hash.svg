<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Hai khóa 2 và 6 cùng băm vào ô 2 nhưng vẫn được lưu riêng</title><desc id="desc">Hai khóa 2 và 6 cùng băm vào ô 2 nhưng vẫn được lưu riêng. Các nhãn và ví dụ được giải thích trong bài.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="600" height="400" fill="#fff" rx="16"/>
<g font-family="'Be Vietnam Pro','Segoe UI',sans-serif"><text x="135" y="50" text-anchor="middle" font-size="28" fill="#27233a">Khóa</text><text x="430" y="50" text-anchor="middle" font-size="28" fill="#27233a">Ô băm</text><rect x="60" y="75" width="120" height="60" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="120" y="115" text-anchor="middle" font-size="28" fill="#27233a">2</text><line x1="195" y1="105" x2="320" y2="210" stroke="#6540ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="175" width="120" height="60" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="120" y="215" text-anchor="middle" font-size="28" fill="#27233a">6</text><line x1="195" y1="205" x2="320" y2="210" stroke="#6540ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="275" width="120" height="60" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="120" y="315" text-anchor="middle" font-size="28" fill="#27233a">9</text><line x1="195" y1="305" x2="320" y2="110" stroke="#6540ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="75" width="210" height="70" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="445" y="120" text-anchor="middle" font-size="28" fill="#27233a">1: 9</text><rect x="340" y="175" width="210" height="70" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><text x="445" y="220" text-anchor="middle" font-size="28" fill="#27233a">2: 2 → 6</text><text x="300" y="375" text-anchor="middle" font-size="28" fill="#6540ad">h(k) = k mod 4</text></g></svg>