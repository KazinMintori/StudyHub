<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Máy hai trạng thái theo dõi tính chẵn lẻ của số ký hiệu 1</title><desc id="desc">Máy hai trạng thái theo dõi tính chẵn lẻ của số ký hiệu 1. Các nhãn và ví dụ được giải thích trong bài.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="600" height="400" fill="#fff" rx="16"/>
<g font-family="'Be Vietnam Pro','Segoe UI',sans-serif"><circle cx="170" cy="210" r="31" fill="#eee9fb" stroke="#6540ad" stroke-width="3"/><text x="170" y="220" text-anchor="middle" font-size="28" fill="#27233a">q₀</text><circle cx="430" cy="210" r="31" fill="#eee9fb" stroke="#6540ad" stroke-width="3"/><text x="430" y="220" text-anchor="middle" font-size="28" fill="#27233a">q₁</text><line x1="210" y1="180" x2="390" y2="180" stroke="#6540ad" stroke-width="4" marker-end="url(#arrow)"/><line x1="390" y1="245" x2="210" y2="245" stroke="#2f5fd0" stroke-width="4" marker-end="url(#arrow)"/><text x="300" y="150" text-anchor="middle" font-size="28" fill="#6540ad">Đọc 1</text><text x="300" y="290" text-anchor="middle" font-size="28" fill="#2f5fd0">Đọc 1</text><text x="170" y="350" text-anchor="middle" font-size="26" fill="#27233a">Số 1 chẵn</text><text x="430" y="350" text-anchor="middle" font-size="26" fill="#27233a">Số 1 lẻ</text></g></svg>