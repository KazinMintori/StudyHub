<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Ma trận đường chéo kéo giãn hình vuông theo một trục</title><desc id="desc">Ma trận đường chéo kéo giãn hình vuông theo một trục. Các nhãn và ví dụ được giải thích trong bài.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="600" height="400" fill="#fff" rx="16"/>
<g font-family="'Be Vietnam Pro','Segoe UI',sans-serif"><rect x="55" y="110" width="120" height="120" rx="10" fill="#e8eefc" stroke="#2f5fd0" stroke-width="2"/><rect x="310" y="110" width="240" height="120" rx="10" fill="#eee9fb" stroke="#6540ad" stroke-width="2"/><line x1="200" y1="170" x2="285" y2="170" stroke="#6540ad" stroke-width="4" marker-end="url(#arrow)"/><text x="115" y="85" text-anchor="middle" font-size="28" fill="#27233a">Trước</text><text x="430" y="85" text-anchor="middle" font-size="28" fill="#27233a">Sau</text><text x="125" y="295" text-anchor="middle" font-size="28" fill="#27233a">(x, y)</text><text x="435" y="295" text-anchor="middle" font-size="28" fill="#27233a">(2x, y)</text><text x="300" y="360" text-anchor="middle" font-size="28" fill="#27233a">Kéo giãn theo một trục</text></g></svg>