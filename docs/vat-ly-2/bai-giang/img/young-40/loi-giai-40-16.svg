  <!-- Well Walls -->
  <line x1="140" y1="50" x2="140" y2="290" class="wall-line" />
  <line x1="460" y1="50" x2="460" y2="290" class="wall-line" />

  <!-- X axis -->
  <line x1="30" y1="290" x2="575" y2="290" class="axis" />
  <polygon points="580,290 570,286 570,294" class="axis-arrow" />
  <text x="585" y="308" class="label">x</text>

  <!-- Y axis at left wall -->
  <line x1="140" y1="290" x2="140" y2="45" class="axis" />
  <polygon points="140,40 136,50 144,50" class="axis-arrow" />
  <text x="130" y="45" class="tick-text-y">|ψ₁(x)|²</text>

  <!-- Peak Indicator -->
  <circle cx="300.0" cy="110.0" r="4" fill="#b91c1c" />
  <text x="300.0" y="98.0" class="annot" text-anchor="middle">Cực đại tại x = L/2 (|ψ₁|² = 2/L)</text>

  <!-- Ticks on X axis -->
  <line x1="140" y1="290" x2="140" y2="296" class="axis" />
  <text x="140" y="312" class="tick-text">0</text>

  <line x1="220.0" y1="290" x2="220.0" y2="295" class="axis" />
  <text x="220.0" y="312" class="tick-text">L/4</text>

  <line x1="300.0" y1="290" x2="300.0" y2="296" class="axis" />
  <text x="300.0" y="312" class="tick-text" font-weight="bold">L/2</text>

  <line x1="380.0" y1="290" x2="380.0" y2="295" class="axis" />
  <text x="380.0" y="312" class="tick-text">3L/4</text>

  <line x1="460" y1="290" x2="460" y2="296" class="axis" />
  <text x="460" y="312" class="tick-text">L</text>

  <!-- Ticks on Y axis -->
  <line x1="135" y1="110.0" x2="140" y2="110.0" class="axis" />
  <text x="132" y="114.0" class="tick-text-y">2/L</text>
</svg>