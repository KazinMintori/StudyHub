<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="title desc">
<title id="title">Điện trường quanh dòng đơn cực từ giả định</title>
<desc id="desc">Dây vuông góc mặt hình. Các đường sức điện là đường tròn đồng tâm quanh dây. Chiều minh họa dùng quy ước số hạng dòng từ âm trong Faraday mở rộng.</desc>
