<g fill="none" stroke="#654393" stroke-width="3">
<circle cx="235" cy="165" r="62"/>
<circle cx="235" cy="165" r="112"/>
<path d="M173 165 A62 62 0 0 1 180 137" marker-end="url(#arrow)"/>
<path d="M347 165 A112 112 0 0 1 341 201" marker-end="url(#arrow)"/>
</g>
<circle cx="235" cy="165" r="17" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="235" cy="165" r="5" fill="#333"/>
<g font-family="Arial, sans-serif" fill="#25202d" font-size="17">
<text x="365" y="145">Đường sức điện</text>
<text x="365" y="170">khép kín</text>
<text x="50" y="303">Dòng đơn cực từ dương hướng ra mặt hình</text>
