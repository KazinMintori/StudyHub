<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" role="img" aria-labelledby="title"><title id="title">Hai tia đặc biệt tạo ảnh thật của thấu kính có tiêu cự 0.10 mét khi vật ở 0.30 mét</title><rect width="480" height="300" rx="12" fill="#ffffff"/><g font-family="system-ui, Segoe UI, sans-serif"><text x="24" y="30" font-size="17" fill="#1f1c2b" text-anchor="start">Thấu kính hội tụ: ảnh thật ngược chiều</text><line x1="35" y1="160" x2="448" y2="160" stroke="#1f1c2b" stroke-width="1.5"/><line x1="280" y1="60" x2="280" y2="228" stroke="#5a37a8" stroke-width="1.5"/><text x="280" y="253" font-size="16" fill="#5a37a8" text-anchor="middle">thấu kính</text><line x1="210.0" y1="155" x2="210.0" y2="165" stroke="#1f1c2b" stroke-width="1.5"/><text x="210.0" y="182" font-size="17" fill="#1f1c2b" text-anchor="middle">F</text><line x1="350.0" y1="155" x2="350.0" y2="165" stroke="#1f1c2b" stroke-width="1.5"/><text x="350.0" y="182" font-size="17" fill="#1f1c2b" text-anchor="middle">F′</text><path d="M70.00,160.00 L70.00,80.00" fill="none" stroke="#1d6b45" stroke-width="4"/><path d="M385.00,160.00 L385.00,200.00" fill="none" stroke="#1d6b45" stroke-width="4"/><path d="M70.00,80.00 L280.00,80.00 L385.00,200.00" fill="none" stroke="#5a37a8" stroke-width="3"/><path d="M70.00,80.00 L280.00,160.00 L385.00,200.00" fill="none" stroke="#2872a0" stroke-width="3"/><text x="70.0" y="65" font-size="16" fill="#1d6b45" text-anchor="middle">vật</text><text x="385.0" y="223.0" font-size="16" fill="#1d6b45" text-anchor="middle">ảnh</text><text x="97" y="286" font-size="16" fill="#1f1c2b" text-anchor="start">s = 0.30 m</text><text x="326" y="286" font-size="16" fill="#1f1c2b" text-anchor="start">s′ = 0.15 m</text></g></svg>
