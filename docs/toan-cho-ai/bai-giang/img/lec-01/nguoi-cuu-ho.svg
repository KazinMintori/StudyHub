<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Lộ trình của người cứu hộ qua điểm tiếp nước</title>
  <desc id="desc">Người cứu hộ tại A, cách bờ 40 mét, chạy tới P trên bờ rồi bơi tới B, cách bờ 30 mét. Hai hình chiếu của A và B cách nhau 60 mét. Góc theta 1 và theta 2 được đo với pháp tuyến tại P. Vị trí P trong sơ đồ là một ví dụ khả thi, không phải nghiệm tối ưu.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="418" height="498" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="420" height="500" fill="#ffffff"/>
    <rect width="420" height="258" fill="#fbf1df"/>
    <rect y="258" width="420" height="198" fill="#e9f4fb"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#1f1c2b">
      <text x="24" y="34" font-weight="600" fill="#8a5100">Bãi cát · 5 m/s</text>
      <text x="24" y="382" font-weight="600" fill="#155b85">Nước</text>
      <text x="24" y="406" fill="#155b85">1.5 m/s</text>
      <!-- Cùng tỉ lệ trên hai trục: 4.2 đơn vị SVG cho mỗi mét. P minh họa x = 45 m. -->
      <path d="M66 90V258M318 258V384" fill="none" stroke="#6b6580" stroke-width="1.5" stroke-dasharray="4 5"/>
      <path d="M66 90L318 384" fill="none" stroke="#6b6580" stroke-width="1.5" stroke-dasharray="7 5"/>
      <path d="M20 258H402" stroke="#155b85" stroke-width="2.5"/>
      <text x="344" y="241" fill="#155b85">Bờ biển</text>
      <text x="374" y="280" fill="#155b85" font-style="italic">Ox</text>
      <!-- Pháp tuyến và các cung góc lấy đúng hướng của AP, PB. -->
      <path d="M255 181V333" stroke="#4f4a62" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="255" y="172" text-anchor="middle" fill="#4f4a62">Pháp tuyến</text>
      <path d="M255 222A36 36 0 0 0 228.093 234.083" fill="none" stroke="#8a5100" stroke-width="2"/>
      <path d="M255 294A36 36 0 0 0 271.100 290.199" fill="none" stroke="#155b85" stroke-width="2"/>
      <text x="229" y="217" fill="#8a5100" font-size="19" font-style="italic">θ₁</text>
      <path d="M264 294L245 320" stroke="#155b85" stroke-width="1.2"/>
      <text x="231" y="342" fill="#155b85" font-size="19" font-style="italic">θ₂</text>
      <!-- Lộ trình và các điểm mốc. -->
      <path d="M66 90L255 258" fill="none" stroke="#8a5100" stroke-width="4" stroke-linecap="round"/>
      <path d="M255 258L318 384" fill="none" stroke="#155b85" stroke-width="4" stroke-linecap="round"/>
      <text x="167" y="146" font-weight="600" fill="#8a5100">Chạy</text>
      <text x="252" y="363" font-weight="600" fill="#155b85">Bơi</text>
      <circle cx="66" cy="90" r="5.5" fill="#8a5100" stroke="#ffffff" stroke-width="2"/>
      <circle cx="255" cy="258" r="5.5" fill="#5a37a8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="318" cy="384" r="5.5" fill="#155b85" stroke="#ffffff" stroke-width="2"/>
      <text x="90" y="73" font-weight="600">Người cứu hộ</text>
      <text x="90" y="98">A (0, 40)</text>
      <text x="232" y="251" fill="#5a37a8" font-weight="600">P</text>
      <text x="190" y="290" fill="#5a37a8" font-style="italic">(x, 0)</text>
      <text x="195" y="408" font-weight="600">B (60, −30)</text>
      <text x="195" y="433">Người gặp nạn</text>
      <circle cx="66" cy="258" r="3" fill="#4f4a62"/>
      <circle cx="318" cy="258" r="3" fill="#4f4a62"/>
      <text x="46" y="282" fill="#4f4a62">O</text>
      <text x="322" y="302" fill="#4f4a62">(60, 0)</text>
      <text x="20" y="186" fill="#4f4a62">40 m</text>
      <text x="338" y="342" fill="#4f4a62">30 m</text>
      <!-- Các đường đo tách khỏi đường đi và có dấu gióng tại hai đầu. -->
      <path d="M66 305H255M66 299V311M255 299V311" stroke="#4f4a62" stroke-width="1.3" fill="none"/>
      <text x="160.5" y="329" text-anchor="middle" font-style="italic">x</text>
      <path d="M255 234H318M255 228V240M318 228V240" stroke="#4f4a62" stroke-width="1.3" fill="none"/>
      <text x="286.5" y="220" text-anchor="middle" font-style="italic">60 − x</text>
      <path d="M24 478H59" stroke="#6b6580" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="72" y="484" fill="#4f4a62">Đường thẳng AB</text>
    </g>
  </g>
  <rect x="1" y="1" width="418" height="498" rx="12" fill="none" stroke="#dcd8e8"/>
</svg>
