<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Chi phí truyền thông mạng: Tổng hợp cục bộ trước khi truyền</text>
    
    <!-- Worker A -->
    <rect x="40" y="65" width="190" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="135" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Máy trạm A (1 GB văn bản)</text>
    <text x="135" y="115" font-size="14" fill="#4f4a62" text-anchor="middle">Từ w xuất hiện 10.000 lần</text>
    <rect x="55" y="130" width="160" height="30" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="135" y="150" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Đếm cục bộ: (w, 10000)</text>
    <text x="135" y="185" font-size="14" fill="#5a37a8" text-anchor="middle">Chỉ gửi 16 byte thay vì 1 GB!</text>

    <!-- Worker B -->
    <rect x="530" y="65" width="190" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="625" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Máy trạm B (1 GB văn bản)</text>
    <text x="625" y="115" font-size="14" fill="#4f4a62" text-anchor="middle">Từ w xuất hiện 5.000 lần</text>
    <rect x="545" y="130" width="160" height="30" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="625" y="150" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Đếm cục bộ: (w, 5000)</text>
    <text x="625" y="185" font-size="14" fill="#5a37a8" text-anchor="middle">Chỉ gửi 16 byte qua mạng!</text>

    <!-- Network Center -->
    <path d="M 235 140 L 325 140" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#greenArrow)"/>
    <path d="M 525 140 L 435 140" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#greenArrow)"/>

    <rect x="330" y="95" width="100" height="90" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="2" filter="url(#shadow)"/>
    <text x="380" y="125" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tổng hợp</text>
    <text x="380" y="150" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">(w, 15000)</text>
    <text x="380" y="172" font-size="14" fill="#5a37a8" text-anchor="middle">Giảm 99.9% mạng</text>
  
</svg>