<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Truy vấn không gian: Vùng Q giao hộp bao A và B (Chỉ mục R-tree)</text>
    
    <!-- 2D Canvas -->
    <rect x="50" y="55" width="400" height="160" rx="8" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1.5"/>
    
    <!-- Bounding Box A -->
    <rect x="80" y="70" width="160" height="80" fill="#eee9fb" fill-opacity="0.5" stroke="#5a37a8" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="95" y="90" font-size="14" font-weight="700" fill="#5a37a8">Hộp bao A</text>
    <circle cx="120" cy="110" r="8" fill="#5a37a8"/>
    <circle cx="180" cy="125" r="8" fill="#5a37a8"/>
    <polygon points="140,80 155,95 130,95" fill="#5a37a8"/>

    <!-- Bounding Box B -->
    <rect x="220" y="110" width="190" height="90" fill="#eee9fb" fill-opacity="0.5" stroke="#5a37a8" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="365" y="130" font-size="14" font-weight="700" fill="#5a37a8">Hộp bao B</text>
    <circle cx="260" cy="160" r="8" fill="#5a37a8"/>
    <circle cx="340" cy="170" r="8" fill="#5a37a8"/>

    <!-- Query Region Q -->
    <rect x="170" y="85" width="150" height="90" fill="#eee9fb" fill-opacity="0.4" stroke="#5a37a8" stroke-width="2.5"/>
    <text x="245" y="105" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Vùng truy vấn Q</text>

    <!-- Explanation Box -->
    <rect x="470" y="55" width="250" height="160" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="595" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Cắt nhánh R-tree:</text>
    <text x="485" y="105" font-size="14" fill="#4f4a62">• Q giao cả hộp A và hộp B</text>
    <text x="485" y="125" font-size="14" fill="#4f4a62">• Không thể bỏ qua nhánh nào</text>
    <text x="485" y="145" font-size="14" fill="#4f4a62">• Phải kiểm tra chi tiết các đối</text>
    <text x="485" y="160" font-size="14" fill="#4f4a62">  tượng bên trong mỗi hộp bao</text>
    <text x="485" y="190" font-size="14" font-weight="600" fill="#5a37a8">→ Lọc thô rồi tinh lọc chính xác</text>
  
</svg>