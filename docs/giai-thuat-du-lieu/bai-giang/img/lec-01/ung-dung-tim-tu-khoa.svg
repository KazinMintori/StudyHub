<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Chỉ mục đảo (Inverted Index): Giao hai danh sách để tìm tài liệu chứa đồng thời 2 từ</text>
    
    <!-- Word 1 -->
    <rect x="40" y="60" width="280" height="65" rx="6" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="100" y="85" font-size="14" font-weight="700" fill="#5a37a8">Từ: &quot;dữ liệu&quot;</text>
    <text x="100" y="108" font-size="14" fill="#4f4a62">Danh sách Doc: [ 1,  4,  7,  9,  15 ]</text>

    <!-- Word 2 -->
    <rect x="40" y="140" width="280" height="65" rx="6" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="100" y="165" font-size="14" font-weight="700" fill="#5a37a8">Từ: &quot;giải thuật&quot;</text>
    <text x="100" y="188" font-size="14" fill="#4f4a62">Danh sách Doc: [ 2,  4,  5,  9,  20 ]</text>

    <!-- Intersection process -->
    <path d="M 335 92 L 440 120" stroke="#5a37a8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 335 172 L 440 145" stroke="#5a37a8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="385" y="145" font-size="14" font-weight="700" fill="#1f1c2b" text-anchor="middle">∩</text>

    <!-- Result -->
    <rect x="455" y="75" width="265" height="115" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="587" y="105" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tài liệu chứa cả 2 từ:</text>
    <rect x="480" y="120" width="215" height="35" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="587" y="142" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Doc 4, Doc 9</text>
    <text x="587" y="175" font-size="14" fill="#5a37a8" text-anchor="middle">Thuật toán 2 con trỏ duyệt song song O(L₁+L₂)</text>
  
</svg>