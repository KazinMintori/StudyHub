<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Lọc ứng viên và Nguy cơ bỏ sót: R̂ = A ∩ R ⊆ R</text>
    
    <!-- All pairs pool -->
    <rect x="40" y="60" width="180" height="150" rx="8" fill="#f5f4f9" stroke="#eee9fb" stroke-width="1.5"/>
    <text x="130" y="85" font-size="14" font-weight="700" fill="#6b6580" text-anchor="middle">Kho N(N-1)/2 cặp</text>
    <circle cx="100" cy="120" r="12" fill="#eee9fb"/>
    <circle cx="150" cy="115" r="12" fill="#eee9fb"/>
    <circle cx="120" cy="160" r="12" fill="#eee9fb"/>
    <text x="130" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Chứa tập đúng R</text>

    <!-- Filter Arrow -->
    <path d="M 225 110 L 295 110" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="260" y="100" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Bộ lọc LSH</text>

    <!-- Candidates A -->
    <rect x="305" y="60" width="190" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="400" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tập ứng viên A</text>
    <rect x="320" y="105" width="160" height="30" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="400" y="125" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Cặp được chọn vào A</text>
    <text x="400" y="160" font-size="14" fill="#5a37a8" text-anchor="middle">Cặp ngoài A: BỊ LOẠI HẲN</text>
    <text x="400" y="180" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Không thể khôi phục!</text>

    <!-- Verify Arrow -->
    <path d="M 500 120 L 550 120" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#greenArrow)"/>
    <text x="525" y="110" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Hậu kiểm</text>

    <!-- Final Result -->
    <rect x="560" y="60" width="160" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="640" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Đầu ra R̂ = A ∩ R</text>
    <rect x="575" y="105" width="130" height="40" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="640" y="130" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Đạt ngưỡng τ</text>
    <text x="640" y="168" font-size="14" fill="#5a37a8" text-anchor="middle">Hậu kiểm chỉ loại</text>
    <text x="640" y="184" font-size="14" fill="#5a37a8" text-anchor="middle">ứng viên sai trong A</text>
  
</svg>