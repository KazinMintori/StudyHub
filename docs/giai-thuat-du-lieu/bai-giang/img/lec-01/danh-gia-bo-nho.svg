<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Đánh giá bộ nhớ làm việc: Giới hạn RAM so với kích thước tệp đĩa</text>
    
    <!-- Disk Sizes -->
    <rect x="50" y="60" width="300" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="200" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Dữ liệu trên Đĩa (Ví dụ Bài 15)</text>
    <rect x="70" y="100" width="260" height="30" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="200" y="120" font-size="14" fill="#5a37a8" text-anchor="middle">Bảng student: 100 khối đĩa</text>
    <rect x="70" y="140" width="260" height="30" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="200" y="160" font-size="14" fill="#5a37a8" text-anchor="middle">Bảng takes: 400 khối đĩa</text>
    <text x="200" y="195" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tổng cộng: 500 khối đĩa</text>

    <!-- RAM Budget -->
    <rect x="410" y="60" width="300" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="2" filter="url(#shadow)"/>
    <text x="560" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Ngân sách RAM làm việc</text>
    <rect x="430" y="100" width="260" height="50" rx="6" fill="#ffffff" stroke="#eee9fb"/>
    <text x="560" y="125" font-size="16" font-weight="700" fill="#5a37a8" text-anchor="middle">M_khối = 20 khối RAM</text>
    <text x="560" y="142" font-size="14" fill="#5a37a8" text-anchor="middle">(Chỉ chứa được 4% tổng dữ liệu!)</text>
    <text x="560" y="175" font-size="14" fill="#1f1c2b" text-anchor="middle">Phải phân bổ: Buffer bảng ngoài,</text>
    <text x="560" y="192" font-size="14" fill="#1f1c2b" text-anchor="middle">Buffer bảng trong và Buffer đầu ra</text>
  
</svg>