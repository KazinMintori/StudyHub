<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Nối bảng (Join): Ghép sinh viên với các môn đã đăng ký</text>
    
    <!-- Table student -->
    <rect x="40" y="55" width="190" height="155" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="135" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Bảng student</text>
    <text x="135" y="100" font-size="14" fill="#5a37a8" text-anchor="middle">5.000 dòng · 100 khối</text>
    <rect x="55" y="112" width="160" height="24" rx="3" fill="#ffffff"/>
    <text x="65" y="128" font-size="14" fill="#1f1c2b">ID: 00128, Zhang, Comp.</text>
    <rect x="55" y="142" width="160" height="24" rx="3" fill="#ffffff"/>
    <text x="65" y="158" font-size="14" fill="#1f1c2b">ID: 12345, Shankar, CS</text>

    <!-- Table takes -->
    <rect x="250" y="55" width="190" height="155" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="345" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Bảng takes</text>
    <text x="345" y="100" font-size="14" fill="#5a37a8" text-anchor="middle">10.000 dòng · 400 khối</text>
    <rect x="265" y="112" width="160" height="24" rx="3" fill="#ffffff"/>
    <text x="275" y="128" font-size="14" fill="#1f1c2b">ID: 00128, CS-101, A</text>
    <rect x="265" y="142" width="160" height="24" rx="3" fill="#ffffff"/>
    <text x="275" y="158" font-size="14" fill="#1f1c2b">ID: 00128, CS-315, A-</text>

    <!-- Join Arrow -->
    <path d="M 450 132 L 500 132" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#greenArrow)"/>

    <!-- Joined Result -->
    <rect x="510" y="55" width="210" height="155" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="615" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Kết quả JOIN</text>
    <rect x="525" y="95" width="180" height="32" rx="3" fill="#ffffff" stroke="#eee9fb"/>
    <text x="535" y="115" font-size="14" font-weight="600" fill="#5a37a8">00128 | Zhang | CS-101</text>
    <rect x="525" y="132" width="180" height="32" rx="3" fill="#ffffff" stroke="#eee9fb"/>
    <text x="535" y="152" font-size="14" font-weight="600" fill="#5a37a8">00128 | Zhang | CS-315</text>
    <text x="615" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Bộ nhớ RAM chỉ có 20 khối!</text>
  
</svg>