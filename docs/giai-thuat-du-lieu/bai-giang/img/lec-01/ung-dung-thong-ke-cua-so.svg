<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Thống kê trên cửa sổ trượt: Phân biệt số lượt vs số người phân biệt</text>
    
    <!-- Timeline Axis -->
    <line x1="60" y1="120" x2="700" y2="120" stroke="#5a37a8" stroke-width="3"/>
    <polygon points="705,120 695,114 695,126" fill="#5a37a8"/>
    <text x="690" y="145" font-size="14" fill="#5a37a8">Thời gian t →</text>

    <!-- Expired Area -->
    <rect x="60" y="65" width="220" height="110" rx="6" fill="#f5f4f9" stroke="#eee9fb" stroke-dasharray="4,4"/>
    <text x="170" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Dữ liệu quá hạn (&gt; 24h)</text>
    <circle cx="120" cy="120" r="14" fill="#f5f4f9"/>
    <text x="120" y="125" font-size="14" fill="#5a37a8" text-anchor="middle">User A</text>
    <circle cx="190" cy="120" r="14" fill="#f5f4f9"/>
    <text x="190" y="125" font-size="14" fill="#5a37a8" text-anchor="middle">User B</text>

    <!-- Active Window Area -->
    <rect x="310" y="55" width="370" height="130" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="2" filter="url(#shadow)"/>
    <text x="495" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Cửa sổ gần đây (24 giờ qua)</text>

    <!-- Events inside window -->
    <circle cx="360" cy="120" r="16" fill="#eee9fb" stroke="#5a37a8"/>
    <text x="360" y="125" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">User A</text>
    
    <circle cx="430" cy="120" r="16" fill="#eee9fb" stroke="#5a37a8"/>
    <text x="430" y="125" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">User C</text>

    <circle cx="500" cy="120" r="16" fill="#eee9fb" stroke="#5a37a8"/>
    <text x="500" y="125" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">User A</text>

    <circle cx="570" cy="120" r="16" fill="#eee9fb" stroke="#5a37a8"/>
    <text x="570" y="125" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">User A</text>

    <circle cx="640" cy="120" r="16" fill="#5a37a8" stroke="#5a37a8"/>
    <text x="640" y="125" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">User D</text>

    <!-- Stats below -->
    <text x="495" y="165" font-size="14" font-weight="700" fill="#1f1c2b" text-anchor="middle">Tổng lượt truy cập = 5 lượt  |  Số người phân biệt = 3 (A, C, D)</text>
    <text x="380" y="215" font-size="14" fill="#5a37a8" text-anchor="middle">Không thể chỉ dùng 1 bộ đếm tăng dần; cần cấu trúc cửa sổ (như thuật toán DGIM)</text>
  
</svg>