<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Chi phí xây dựng chỉ mục (Offline Build) vs Hiệu quả truy vấn (Online Query)</text>
    
    <!-- Offline Step -->
    <rect x="50" y="60" width="300" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="200" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Giai đoạn Offline (1 Lần)</text>
    <text x="200" y="110" font-size="14" fill="#4f4a62" text-anchor="middle">Kho 10 tỷ vector thô → Xây dựng chỉ mục HNSW/PQ</text>
    <rect x="70" y="125" width="260" height="40" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="200" y="145" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tốn nhiều giờ CPU, RAM đỉnh lớn</text>
    <text x="200" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Chấp nhận đầu tư chi phí chuẩn bị ban đầu</text>

    <!-- Arrow -->
    <path d="M 360 135 L 400 135" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Online Step -->
    <rect x="410" y="60" width="300" height="150" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="560" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Giai đoạn Online (Hàng triệu lần)</text>
    <text x="560" y="110" font-size="14" fill="#4f4a62" text-anchor="middle">Mỗi truy vấn đến tái sử dụng cấu trúc chỉ mục</text>
    <rect x="430" y="125" width="260" height="40" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="560" y="145" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Độ trễ cực thấp: &lt; 5 mili-giây</text>
    <text x="560" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Lợi ích lớn khi số truy vấn N_q rất lớn</text>
  
</svg>