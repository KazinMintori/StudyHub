<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Chất lượng kết quả gần đúng: Độ thu hồi recall@k (Ví dụ k = 5)</text>
    
    <!-- True ground truth -->
    <rect x="40" y="65" width="260" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="170" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tập chuẩn đúng N₅(q)</text>
    <rect x="60" y="105" width="220" height="40" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="170" y="130" font-size="14" font-weight="700" fill="#1f1c2b" text-anchor="middle">{ a,  b,  c,  d,  e }</text>
    <text x="170" y="170" font-size="14" fill="#5a37a8" font-weight="600" text-anchor="middle">a, b: Hàng xóm thật bị bỏ sót</text>
    <text x="170" y="190" font-size="14" fill="#5a37a8" text-anchor="middle">(False Negatives)</text>

    <!-- Retrieved set -->
    <rect x="460" y="65" width="260" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="590" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tập trả về N̂₅(q)</text>
    <rect x="480" y="105" width="220" height="40" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="590" y="130" font-size="14" font-weight="700" fill="#1f1c2b" text-anchor="middle">{ c,  d,  e,  f,  g }</text>
    <text x="590" y="170" font-size="14" fill="#5a37a8" font-weight="600" text-anchor="middle">f, g: Mục sai nằm ngoài tập đúng</text>
    <text x="590" y="190" font-size="14" fill="#5a37a8" text-anchor="middle">(False Positives)</text>

    <!-- Overlap Center Box -->
    <rect x="320" y="90" width="120" height="80" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="2" filter="url(#shadow)"/>
    <text x="380" y="115" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Giao: { c, d, e }</text>
    <text x="380" y="135" font-size="15" font-weight="700" fill="#5a37a8" text-anchor="middle">3 / 5</text>
    <text x="380" y="155" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Recall = 60%</text>
  
</svg>