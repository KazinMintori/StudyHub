<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Nén ảnh có mất thông tin (JPEG): Lượng tử hóa làm tròn các mức sáng</text>
    
    <!-- Continuous levels -->
    <rect x="50" y="60" width="220" height="145" rx="8" fill="#ffffff" stroke="#eee9fb" stroke-width="1.5"/>
    <text x="160" y="85" font-size="14" font-weight="700" fill="#4f4a62" text-anchor="middle">Mức sáng gốc (256 mức)</text>
    <rect x="70" y="100" width="180" height="18" fill="#1f1c2b"/>
    <rect x="70" y="120" width="180" height="18" fill="#6b6580"/>
    <rect x="70" y="140" width="180" height="18" fill="#5a37a8"/>
    <rect x="70" y="160" width="180" height="18" fill="#eee9fb"/>
    <text x="160" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">Mức xám 118, 120, 123, 127...</text>

    <!-- Quantization Arrow -->
    <path d="M 285 132 L 400 132" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#redArrow)"/>
    <text x="342" y="115" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Lượng tử hóa</text>
    <text x="342" y="152" font-size="14" fill="#5a37a8" text-anchor="middle">(Làm tròn số)</text>

    <!-- Quantized levels -->
    <rect x="420" y="60" width="290" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="565" y="85" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Gộp thành 1 mức đại diện</text>
    <rect x="445" y="105" width="240" height="40" rx="4" fill="#5a37a8"/>
    <text x="565" y="130" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Đại diện chung = 120</text>
    <text x="565" y="170" font-size="14" fill="#5a37a8" text-anchor="middle">Mất sự phân biệt tinh tế giữa các mức ban đầu</text>
    <text x="565" y="190" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Giảm đáng kể dung lượng nhưng có sai số tái tạo</text>
  
</svg>