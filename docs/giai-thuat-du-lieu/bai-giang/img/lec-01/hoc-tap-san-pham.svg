<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Chu trình kỹ năng tạo sản phẩm học tập (CLO1 → CLO4)</text>
    
    <g transform="translate(35, 65)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="150" height="120" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
      <text x="75" y="30" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">1. Đặc tả chặt chẽ</text>
      <text x="75" y="55" font-size="14" fill="#4f4a62" text-anchor="middle">• Miền đầu vào</text>
      <text x="75" y="75" font-size="14" fill="#4f4a62" text-anchor="middle">• Đầu ra chính xác</text>
      <text x="75" y="95" font-size="14" fill="#4f4a62" text-anchor="middle">• Giả thiết &amp; sai số</text>

      <path d="M 155 60 L 175 60" stroke="#5a37a8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2 -->
      <rect x="180" y="0" width="150" height="120" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
      <text x="255" y="30" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">2. Dry-run vết chạy</text>
      <text x="255" y="55" font-size="14" fill="#4f4a62" text-anchor="middle">• Chạy tay ví dụ nhỏ</text>
      <text x="255" y="75" font-size="14" fill="#4f4a62" text-anchor="middle">• Bảng biến trạng thái</text>
      <text x="255" y="95" font-size="14" fill="#4f4a62" text-anchor="middle">• Trường hợp biên</text>

      <path d="M 335 60 L 355 60" stroke="#5a37a8" stroke-width="2" marker-end="url(#greenArrow)"/>

      <!-- Step 3 -->
      <rect x="360" y="0" width="150" height="120" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
      <text x="435" y="30" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">3. Lập luận bất biến</text>
      <text x="435" y="55" font-size="14" fill="#4f4a62" text-anchor="middle">• Bất biến vòng lặp</text>
      <text x="435" y="75" font-size="14" fill="#4f4a62" text-anchor="middle">• Chứng minh dừng</text>
      <text x="435" y="95" font-size="14" fill="#4f4a62" text-anchor="middle">• Tính đúng đắn</text>

      <path d="M 515 60 L 535 60" stroke="#5a37a8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 4 -->
      <rect x="540" y="0" width="150" height="120" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="615" y="30" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">4. Cài đặt &amp; Đo đạc</text>
      <text x="615" y="55" font-size="14" fill="#4f4a62" text-anchor="middle">• Code Python/C++</text>
      <text x="615" y="75" font-size="14" fill="#4f4a62" text-anchor="middle">• Đo độ trễ, RAM</text>
      <text x="615" y="95" font-size="14" fill="#4f4a62" text-anchor="middle">• Báo cáo trung thực</text>
    </g>
    <text x="380" y="215" font-size="14" fill="#5a37a8" text-anchor="middle">Mã chạy đúng 1 lần không thay thế chứng minh; chạy nhanh 1 lần không chứng minh độ phức tạp tiệm cận</text>
  
</svg>