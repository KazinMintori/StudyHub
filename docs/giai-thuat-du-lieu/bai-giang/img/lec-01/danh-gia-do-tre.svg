<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Độ trễ truy vấn (Latency): Trải dài từ lúc nhận yêu cầu đến lúc trả kết quả</text>
    
    <!-- Timeline Stages -->
    <g transform="translate(40, 70)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="130" height="60" rx="6" fill="#f5f4f9" stroke="#5a37a8"/>
      <text x="65" y="28" font-size="14" font-weight="700" fill="#4f4a62" text-anchor="middle">1. Nhận truy vấn</text>
      <text x="65" y="48" font-size="14" fill="#5a37a8" text-anchor="middle">Phân giải &amp; Parse</text>

      <!-- Stage 2 -->
      <rect x="140" y="0" width="140" height="60" rx="6" fill="#eee9fb" stroke="#5a37a8"/>
      <text x="210" y="28" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">2. Xếp hàng / Chờ</text>
      <text x="210" y="48" font-size="14" fill="#5a37a8" text-anchor="middle">Tải hệ thống cao</text>

      <!-- Stage 3 -->
      <rect x="290" y="0" width="180" height="60" rx="6" fill="#eee9fb" stroke="#5a37a8"/>
      <text x="380" y="28" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">3. Truy cập chỉ mục</text>
      <text x="380" y="48" font-size="14" fill="#5a37a8" text-anchor="middle">Đọc RAM / Cache / Đĩa</text>

      <!-- Stage 4 -->
      <rect x="480" y="0" width="200" height="60" rx="6" fill="#eee9fb" stroke="#5a37a8"/>
      <text x="580" y="28" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">4. Tính toán &amp; Trả về</text>
      <text x="580" y="48" font-size="14" fill="#5a37a8" text-anchor="middle">Xếp hạng &amp; Gửi socket</text>
    </g>

    <!-- Large latency bracket -->
    <path d="M 40 150 L 720 150" stroke="#5a37a8" stroke-width="2"/>
    <path d="M 40 145 L 40 155" stroke="#5a37a8" stroke-width="2"/>
    <path d="M 720 145 L 720 155" stroke="#5a37a8" stroke-width="2"/>
    <text x="380" y="175" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tổng độ trễ (Latency) = T_nhận + T_chờ + T_truy_cập + T_tính_toán</text>
    <text x="380" y="200" font-size="14" fill="#5a37a8" text-anchor="middle">Khác với Thông lượng (Throughput = số truy vấn xử lý trên một giây)</text>
  
</svg>