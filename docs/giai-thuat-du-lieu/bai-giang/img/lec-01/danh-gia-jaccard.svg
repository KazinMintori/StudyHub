<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Độ tương đồng Jaccard (MMDS Ví dụ 3.1): J(S, T) = |S ∩ T| / |S ∪ T|</text>
    
    <!-- Circle S -->
    <circle cx="270" cy="130" r="75" fill="#eee9fb" fill-opacity="0.6" stroke="#5a37a8" stroke-width="2"/>
    <!-- Circle T -->
    <circle cx="370" cy="130" r="75" fill="#eee9fb" fill-opacity="0.6" stroke="#5a37a8" stroke-width="2"/>

    <!-- Labels -->
    <text x="220" y="90" font-size="14" font-weight="700" fill="#5a37a8">Tập S</text>
    <text x="420" y="90" font-size="14" font-weight="700" fill="#5a37a8">Tập T</text>

    <!-- Elements in S only -->
    <text x="235" y="125" font-size="14" font-weight="600" fill="#1f1c2b">2 phần tử</text>
    <text x="235" y="145" font-size="14" fill="#6b6580">chỉ thuộc S</text>

    <!-- Intersection elements -->
    <text x="320" y="125" font-size="14" font-weight="700" fill="#1f1c2b" text-anchor="middle">3</text>
    <text x="320" y="145" font-size="14" font-weight="600" fill="#1f1c2b" text-anchor="middle">chung</text>

    <!-- Elements in T only -->
    <text x="405" y="125" font-size="14" font-weight="600" fill="#1f1c2b">3 phần tử</text>
    <text x="405" y="145" font-size="14" fill="#6b6580">chỉ thuộc T</text>

    <!-- Formula Box -->
    <rect x="500" y="65" width="220" height="135" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="610" y="95" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Tính Jaccard:</text>
    <text x="610" y="125" font-size="16" font-weight="700" fill="#5a37a8" text-anchor="middle">J(S, T) = 3 / (2+3+3)</text>
    <text x="610" y="155" font-size="18" font-weight="700" fill="#5a37a8" text-anchor="middle">= 3 / 8 = 0.375</text>
    <text x="610" y="185" font-size="14" fill="#6b6580" text-anchor="middle">Đạt yêu cầu khi ngưỡng τ ≤ 3/8</text>
  
</svg>