<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Xử lý dòng dữ liệu: Mẫu theo người dùng &amp; Bộ lọc Bloom Filter</text>
    
    <!-- Part 1: Sampling by User Key -->
    <rect x="40" y="55" width="320" height="155" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="200" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">1. Lấy mẫu nhật ký tìm kiếm</text>
    <text x="60" y="105" font-size="14" fill="#4f4a62">• Dòng truy vấn liên tục (User, Query, Time)</text>
    <text x="60" y="125" font-size="14" fill="#4f4a62">• Lấy mẫu từng dòng lẻ: Mất hành vi lặp</text>
    <rect x="60" y="138" width="280" height="32" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="200" y="158" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Băm User_ID: hash(u) % 10 == 0</text>
    <text x="200" y="195" font-size="14" fill="#5a37a8" text-anchor="middle">→ Giữ trọn vẹn toàn bộ lịch sử 10% người dùng</text>

    <!-- Part 2: Bloom Filter Mail Filter -->
    <rect x="400" y="55" width="320" height="155" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="560" y="80" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">2. Bộ lọc Bloom (Lọc thư)</text>
    <text x="420" y="105" font-size="14" fill="#4f4a62">• Thư đến kèm địa chỉ gửi</text>
    <text x="420" y="125" font-size="14" fill="#4f4a62">• Danh sách trắng vượt quá RAM</text>
    <rect x="420" y="138" width="280" height="32" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="560" y="158" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Mảng bit: [0, 1, 0, 1, 1, 0, ...]</text>
    <text x="560" y="185" font-size="14" fill="#5a37a8" text-anchor="middle">Báo &quot;KHÔNG&quot; → chắc chắn 100%</text>
    <text x="560" y="200" font-size="14" fill="#5a37a8" text-anchor="middle">Báo &quot;CÓ THỂ CÓ&quot; → mới tra cứu đĩa</text>
  
</svg>