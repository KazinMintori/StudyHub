<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" style="max-width: 760px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a37a8"/>
      <stop offset="100%" stop-color="#5a37a8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee9fb"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <linearGradient id="softRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f9"/>
      <stop offset="100%" stop-color="#eee9fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f1c2b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a37a8"/>
    </marker>
  </defs>
  <rect width="760" height="240" rx="12" fill="#ffffff" stroke="#f5f4f9" stroke-width="1.5"/>
  
    <text x="380" y="28" font-size="15" font-weight="700" fill="#1f1c2b" text-anchor="middle">Chi phí cập nhật: Sửa bản ghi gốc và đồng bộ cấu trúc chỉ mục</text>
    
    <!-- Table Update -->
    <rect x="50" y="65" width="290" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="195" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">1. Sửa bản ghi trong Bảng</text>
    <rect x="70" y="110" width="250" height="35" rx="4" fill="#ffffff" stroke="#eee9fb"/>
    <text x="195" y="132" font-size="14" fill="#1f1c2b" text-anchor="middle">Mã ID 101: Lương cũ 50.000 → Mới 65.000</text>
    <text x="195" y="175" font-size="14" fill="#5a37a8" text-anchor="middle">Nếu chỉ sửa ở đây, truy vấn khoảng</text>
    <text x="195" y="192" font-size="14" fill="#5a37a8" text-anchor="middle">sẽ đọc sai theo chỉ mục cũ!</text>

    <!-- Sync Arrow -->
    <path d="M 345 137 L 415 137" stroke="#5a37a8" stroke-width="2.5" marker-end="url(#redArrow)"/>
    <text x="380" y="125" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">Đồng bộ</text>

    <!-- Index Update -->
    <rect x="420" y="65" width="290" height="145" rx="8" fill="#eee9fb" stroke="#5a37a8" stroke-width="1.5"/>
    <text x="565" y="90" font-size="14" font-weight="700" fill="#5a37a8" text-anchor="middle">2. Sửa chỉ mục (B+-Tree)</text>
    <rect x="440" y="110" width="250" height="35" rx="4" fill="#ffffff" stroke="#5a37a8"/>
    <text x="565" y="132" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Xóa khóa 50k, Chèn khóa mới 65k</text>
    <text x="565" y="175" font-size="14" fill="#5a37a8" text-anchor="middle">Phát sinh tách/gộp nút lá cây B+</text>
    <text x="565" y="192" font-size="14" font-weight="600" fill="#5a37a8" text-anchor="middle">Phải đảm bảo tính nhất quán dữ liệu</text>
  
</svg>