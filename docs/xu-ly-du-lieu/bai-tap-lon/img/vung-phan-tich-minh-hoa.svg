<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Hai vùng phân tích giả định và hai listing</title>
  <desc id="desc">Trục ngang là kinh độ, trục dọc là vĩ độ. Listing LST-A nằm trong hình chữ nhật Vùng-Mẫu-A, listing LST-B nằm trong hình chữ nhật Vùng-Mẫu-B. Không sử dụng tọa độ hay ranh giới thật.</desc>
  <rect width="360" height="340" rx="12" fill="#fffdf8"/>
  <g font-family="Arial, sans-serif" fill="#2c2438" font-size="16">
    <text x="20" y="30">Vĩ độ</text>
    <rect x="50" y="60" width="135" height="200" fill="#eee6fc" stroke="#6b4799" stroke-width="2"/>
    <rect x="185" y="60" width="135" height="200" fill="#dcefeb" stroke="#34776d" stroke-width="2"/>
    <path d="M40 275V48m-5 7 5-7 5 7M40 275h292m-7-5 7 5-7 5" fill="none" stroke="#53475f" stroke-width="2"/>
    <circle cx="110" cy="130" r="6" fill="#6b4799"/>
    <text x="110" y="116" text-anchor="middle">LST-A</text>
    <circle cx="250" cy="180" r="6" fill="#34776d"/>
    <text x="250" y="166" text-anchor="middle">LST-B</text>
    <text x="117" y="242" text-anchor="middle" font-size="15">Vùng-Mẫu-A</text>
    <text x="252" y="242" text-anchor="middle" font-size="15">Vùng-Mẫu-B</text>
    <text x="280" y="304" text-anchor="middle">Kinh độ</text>
    <text x="180" y="328" text-anchor="middle" fill="#665b71" font-size="14">Ví dụ giả định, không phải bản đồ thực.</text>
  </g>
</svg>
