name: Deploy UETệ to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and verify without publishing GitHub Pages
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble pinned private course sources
        env:
          COURSE_DEPLOY_KEYS: ${{ secrets.STUDYHUB_COURSE_DEPLOY_KEYS }}
        run: npm run courses:sync

      - name: Check interface design tokens
        run: npm run audit:tokens

      - name: Verify lecture formatting
        run: node scripts/verify-lecture-containers.mjs

      - name: Verify embedded probability library
        run: node scripts/verify-probability-embeds.mjs

      - name: Verify architecture and current content model
        run: |
          npm run content:index
          npm run verify:architecture
          node scripts/verification/verify-content-model.mjs

      - name: Verify feature rules and rendering
        run: |
          npm run test:features
          npm test

      - name: Verify browser navigation and responsive reading
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/studyhub-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:navigation
          node scripts/verification/verify-course-workspace.mjs
          node scripts/verification/verify-lecture-usability.mjs

      - name: Save browser verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            qa/navigation-stability/
            qa/lecture-usability/
            qa/course-workspace/
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify batched build integration
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/verification/verify-batch-build.mjs

      - name: Show build runner memory
        run: free -h

      - name: Build with VitePress
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run ci:build

      - name: Verify built-site navigation with the production base path
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          QA_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/studyhub-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$QA_URL/" > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:navigation

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
