name: Deploy UETệ to GitHub Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and verify without publishing GitHub Pages
        required: false
        type: boolean
        default: false
      fixture_only:
        description: Verify the small production-theme fixture without a full site build
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.verify_only || inputs.fixture_only) && format('verify-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble pinned private course sources
        env:
          COURSE_DEPLOY_KEYS: ${{ secrets.STUDYHUB_COURSE_DEPLOY_KEYS }}
        run: npm run courses:sync

      - name: Check interface design tokens
        run: npm run audit:tokens

      - name: Verify lecture formatting
        run: node scripts/verify-lecture-containers.mjs

      - name: Verify embedded probability library
        run: node scripts/verify-probability-embeds.mjs

      - name: Verify architecture and current content model
        run: |
          npm run content:index
          npm run verify:architecture
          node scripts/verification/verify-content-model.mjs

      - name: Verify feature rules and rendering
        if: '!inputs.fixture_only'
        run: |
          npm run test:features
          npm test

      - name: Verify browser navigation and responsive reading
        if: '!inputs.fixture_only'
        env:
          BASE_PATH: /
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/studyhub-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:navigation
          node scripts/verification/verify-course-workspace.mjs
          node scripts/verification/verify-lecture-usability.mjs

      - name: Save browser verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          retention-days: 3
          path: |
            qa/navigation-stability/
            qa/lecture-usability/
            qa/course-workspace/
            qa/batch-build-fixture/
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify batched build integration
        env:
          QA_REAL_THEME: '1'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/verification/verify-batch-build.mjs

      - name: Show build runner memory
        run: free -h

      - name: Save batch fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-fixture-diagnostics
          retention-days: 3
          path: qa/batch-build-fixture/
          if-no-files-found: ignore

      - name: Build with VitePress
        if: '!inputs.fixture_only'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run ci:build

      - name: Verify built-site navigation with the production base path
        if: '!inputs.fixture_only'
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          QA_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/studyhub-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$QA_URL/" > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:navigation

      - name: Upload Pages artifact
        if: success() && !inputs.fixture_only && !inputs.verify_only
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
          retention-days: 1

  deploy:
    if: success() && (github.event_name != 'workflow_dispatch' || (!inputs.verify_only && !inputs.fixture_only))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  clean-old-pages-artifacts:
    name: Remove superseded Pages build archives
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep the current deployment archive and verification reports
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const current = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId
            });
            const cutoff = Date.parse(current.data.created_at);
            if (!Number.isFinite(cutoff)) throw new Error('Missing current run timestamp');
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            for (const artifact of artifacts) {
              const previousRun = artifact.workflow_run?.id;
              if (artifact.name !== 'github-pages' || artifact.expired ||
                  !previousRun || previousRun === context.runId ||
                  !(Date.parse(artifact.created_at) < cutoff)) continue;
              const previous = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: previousRun
              });
              if (previous.data.status !== 'completed') continue;
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id
              });
              core.info(`Removed superseded Pages artifact ${artifact.id}`);
            }
